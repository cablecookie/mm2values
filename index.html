<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MM2 Values – Supreme Synced</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
    }

    header {
      text-align: center;
      padding: 30px 10px;
      background: #1a1a1a;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .item {
      background: #1c1c1c;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      transition: transform 0.15s, background 0.15s;
      border: 1px solid #333;
    }

    .item:hover {
      transform: translateY(-3px);
      background: #262626;
    }

    .name {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .value {
      font-size: 18px;
      color: #ccc;
    }
  </style>
</head>
<body>

<header>MM2 Godly Values</header>

<div class="container">

  <div class="item">
    <div class="name">Traveler's Gun</div>
    <div class="value">Value: 5,000</div>
  </div>

  <div class="item">
    <div class="name">Evergun</div>
    <div class="value">Value: 3,450</div>
  </div>

  <div class="item">
    <div class="name">Constellation</div>
    <div class="value">Value: 2,700</div>
  </div>

  <div class="item">
    <div class="name">Evergreen</div>
    <div class="value">Value: 2,500</div>
  </div>

  <div class="item">
    <div class="name">Turkey</div>
    <div class="value">Value: 2,450</div>
  </div>

  <div class="item">
    <div class="name">Alienbeam</div>
    <div class="value">Value: 1,925</div>
  </div>

  <div class="item">
    <div class="name">Vampire's Gun</div>
    <div class="value">Value: 1,800</div>
  </div>

  <div class="item">
    <div class="name">Darkshot</div>
    <div class="value">Value: 1,625</div>
  </div>

  <div class="item">
    <div class="name">Darksword</div>
    <div class="value">Value: 1,600</div>
  </div>

  <div class="item">
    <div class="name">Raygun</div>
    <div class="value">Value: 1,375</div>
  </div>

</div>

</body>
</html>
