<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MM2 Values – Supreme Synced</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: #fff;
    }

    header {
      text-align: center;
      padding: 30px 10px;
      background: #111;
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 1px;
      border-bottom: 2px solid #222;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;

      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
    }

    .item {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #333;
      text-align: center;
      transition: 0.2s;
    }

    .item:hover {
      transform: translateY(-5px);
      background: #242424;
      box-shadow: 0 0 15px rgba(255,255,255,0.1);
    }

    .item img {
      width: 140px;
      height: auto;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .value {
      font-size: 18px;
      color: #ccc;
    }
  </style>
</head>

<body>

<header>MM2 Godly Values</header>

<div class="container">

  <!-- Traveler's Gun -->
  <div class="item">
    <img src="travelers-gun.png" alt="Traveler's Gun">
    <div class="name">Traveler's Gun</div>
    <div class="value">Value: 5000</div>
  </div>

  <!-- Add more items here -->
<div class="item">
  <img src="evergun.png" alt="Evergun">
  <div class="name">Evergun</div>
  <div class="value">Value: 3450</div>
</div>
