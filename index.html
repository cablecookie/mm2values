<!DOCTYPE html>
<html>
<head>
  <title>MM2 Values</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }
    .item {
      background: white;
      padding: 15px;
      margin: 10px auto;
      max-width: 500px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .item-name {
      font-size: 20px;
      font-weight: bold;
      color: #222;
    }
    .item-value {
      font-size: 16px;
      color: #555;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <h1>MM2 Values</h1>

  <div class="item">
    <div class="item-name">Chroma Swirly Gun</div>
    <div class="item-value">Value: 500</div>
  </div>

  <div class="item">
    <div class="item-name">Chroma Heat</div>
    <div class="item-value">Value: 450</div>
  </div>

  <div class="item">
    <div class="item-name">Chroma Laser</div>
    <div class="item-value">Value: 400</div>
  </div>

  <div class="item">
    <div class="item-name">Chroma Fang</div>
    <div class="item-value">Value: 380</div>
  </div>

</body>
</html>
